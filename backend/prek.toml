default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run --frozen ruff format",
    language = "system",
    types_or = ["python", "pyi"],
  },
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run --frozen ruff check --fix --exit-non-zero-on-fix",
    language = "system",
    types_or = ["python", "pyi"],
  },
  {
    id = "mypy",
    name = "mypy",
    entry = "uv run --frozen mypy app scripts tests",
    language = "system",
    pass_filenames = false,
    files = "^(pyproject\\.toml|(app|scripts|tests)/.*\\.(py|pyi))$",
    stages = ["pre-push"],
  },
  {
    id = "pytest-unit",
    name = "pytest unit",
    entry = "uv run --frozen pytest",
    args = ["-m", "not integration", "--no-cov"],
    language = "system",
    pass_filenames = false,
    files = "^(pyproject\\.toml|(app|scripts|tests)/.*\\.(py|pyi))$",
    stages = ["pre-push"],
  },
]
