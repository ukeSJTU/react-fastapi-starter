name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen prek validate-config prek.toml backend/prek.toml frontend/prek.toml
      - name: Check repository files
        run: >-
          uv run --frozen prek run
          .:check-case-conflict
          .:check-json
          .:check-merge-conflict
          .:check-toml
          .:check-yaml
          .:trailing-whitespace
          .:end-of-file-fixer
          --all-files
      - name: Check for hook changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --package backend --frozen
      - run: uv run --frozen ruff format --check .
        working-directory: backend
      - run: uv run --frozen ruff check .
        working-directory: backend
      - run: uv run --frozen mypy app scripts tests
        working-directory: backend
      - run: uv run --frozen pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          cache: true
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend check
      - run: pnpm --filter frontend build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          cache: true
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: uv sync --package backend --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run --frozen python -m scripts.export_openapi
        working-directory: backend
      - run: pnpm --filter frontend generate
      - name: Check generated files
        run: |
          git status --short --untracked-files=all -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts
          git diff --exit-code -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts
          test -z "$(git status --porcelain --untracked-files=all -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          cache: true
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:e2e
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Run production-stack smoke tests
        run: pnpm test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
