name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app scripts tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.18.0
          runtime: node@24
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:routes
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/setup@v1
        with:
          version: 11.18.0
          runtime: node@24
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv run python -m scripts.export_openapi
        working-directory: backend
      - run: pnpm generate
        working-directory: frontend
      - name: Check generated files
        run: |
          git status --short --untracked-files=all -- openapi.json frontend/src/api/generated
          git diff --exit-code -- openapi.json frontend/src/api/generated
          test -z "$(git status --porcelain --untracked-files=all -- openapi.json frontend/src/api/generated)"
