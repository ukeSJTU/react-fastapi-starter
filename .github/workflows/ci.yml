name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen prek validate-config prek.toml backend/prek.toml frontend/prek.toml
      - name: Check repository files
        run: >-
          uv run --frozen prek run
          .:check-json
          .:check-toml
          .:check-yaml
          .:trailing-whitespace
          .:end-of-file-fixer
          --all-files
      - name: Check for hook changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --package backend --frozen
      - run: uv run --frozen ruff format --check .
        working-directory: backend
      - run: uv run --frozen ruff check .
        working-directory: backend
      - run: uv run --frozen mypy app scripts tests
        working-directory: backend
      - run: uv run --frozen pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend check
      - run: pnpm --filter frontend build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/setup@v1
        with:
          cache: true
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: uv sync --package backend --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run --frozen python -m scripts.export_openapi
        working-directory: backend
      - run: pnpm --filter frontend generate
      - name: Check generated files
        run: |
          git status --short --untracked-files=all -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts
          git diff --exit-code -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts
          test -z "$(git status --porcelain --untracked-files=all -- openapi.json frontend/src/api/generated frontend/src/routeTree.gen.ts)"

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PORT: "18080"
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build production images
        run: >-
          docker compose
          -f compose.yaml
          -f compose.production.yaml
          --profile tools
          --parallel 2
          build
      - name: Apply database migrations
        run: >-
          docker compose
          -f compose.yaml
          -f compose.production.yaml
          run --rm migrate
      - name: Start production stack
        run: >-
          docker compose
          -f compose.yaml
          -f compose.production.yaml
          up --detach --wait --no-build
      - name: Smoke test frontend and API health
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}/" > /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}/health"
          openapi_status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${APP_PORT}/openapi.json"
          )"
          test "${openapi_status}" = "404"
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.production.yaml ps
          docker compose -f compose.yaml -f compose.production.yaml logs --no-color
      - name: Clean up containers and volumes
        if: always()
        run: >-
          docker compose
          -f compose.yaml
          -f compose.production.yaml
          down --volumes --remove-orphans
